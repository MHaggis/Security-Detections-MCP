# REFERENCE ONLY: this file is not loaded by the automation runtime.
# Use environment variables and the scheduler CLI documented in ../README.md.
# Defaults below describe implemented behavior; editing this file has no effect.
runtime:
  mode_environment: AUTOMATION_MODE
  default_mode: disabled
  database_environment: AUTOMATION_DB_PATH
  database_required: true
  adapter_environment: AGENTS_CLI_PATH
  invocation_timeout_minutes: 30
  poll_interval_seconds: 30
queue:
  default_max_attempts: 3
  automatic_crash_replay: false
  supported_scheduled_job: feed_collection
  timezone: UTC
review:
  required_for_live_results: true
  approval_publishes_prs: false
  expiry_processing: explicit_cli_command
# Configure feed definitions in collectors/multi-source-collector.ts.
# Optional notifications/learning scaffolding is not wired into the worker.
