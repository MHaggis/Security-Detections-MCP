name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: node -e "const fs=require('fs'); const files=['dist/index.js','dist/db/connection.js','dist/db/patterns.js','dist/tools/engineering/index.js']; let ok=true; for(const f of files){if(!fs.existsSync(f)){console.error('Missing',f);ok=false;}else{console.log('OK',f);}} if(!ok)process.exit(1); console.log('All expected build outputs exist');"

  # Cross-platform database lifecycle tests (no external data needed)
  test-platform:
    runs-on: ${{ matrix.os }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run cross-platform database tests
        run: node tests/cross-platform-test.js

      - name: Verify source-qualified identity and legacy migration
        run: node tests/source-identity-test.js

      - name: Run parser fixture tests
        shell: bash
        run: |
          for test in tests/*-parser-test.js; do
            node "$test"
          done

      - name: Verify MCP stdio protocol and fixture query
        run: node tests/mcp-smoke-test.js

      - name: Validate database schema
        shell: bash
        run: |
          node -e "
            import { initDb, getDb } from './dist/db/connection.js';
            import { initPatternsSchema } from './dist/db/patterns.js';
            
            initDb();
            initPatternsSchema();
            
            const db = getDb();
            const tables = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table'\").all();
            const tableNames = tables.map(t => t.name);
            
            const required = ['detections', 'stories', 'detection_patterns', 'field_reference', 'style_conventions', 'kg_entities', 'kg_relations', 'kg_observations', 'kg_decisions', 'kg_learnings'];
            
            for (const table of required) {
              if (!tableNames.includes(table)) {
                console.error('Missing table:', table);
                process.exit(1);
              }
            }
            
            console.log('All required tables exist:', required.length);
          "

  # Full integration tests with current upstream Sigma and Splunk content
  test-integration:
    runs-on: ${{ matrix.os }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download Sigma rules (sparse checkout)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/SigmaHQ/sigma.git detections/sigma
          cd detections/sigma
          git sparse-checkout set rules rules-threat-hunting

      - name: Download Splunk content (sparse checkout)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/splunk/security_content.git detections/splunk
          cd detections/splunk
          git sparse-checkout set detections stories

      - name: Run CI integration test (index + query + recreate cycle)
        shell: bash
        env:
          SIGMA_PATHS: detections/sigma/rules,detections/sigma/rules-threat-hunting
        run: node tests/ci-integration-test.js

      - name: Verify content queries and engineering patterns
        shell: bash
        env:
          SIGMA_PATHS: detections/sigma/rules,detections/sigma/rules-threat-hunting
          SPLUNK_PATHS: detections/splunk/detections
          STORY_PATHS: detections/splunk/stories
          JAMF_PROTECT_PATHS: tests/fixtures/jamf_protect
        run: node tests/integration-test.js && node tests/engineering-tools-test.js

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run lint

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:http

  catalog-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Verify real PostgreSQL and PostgREST catalog identity
        run: node --experimental-strip-types web/tests/source-identity.integration.mjs
      - name: Verify dedicated catalog login and TLS transport
        run: node --experimental-strip-types web/tests/direct-catalog.integration.mjs
