name: Release validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        npm: [bundled, '11.12.0']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Match pinned publisher npm where selected
        if: matrix.npm != 'bundled'
        run: npm install --global npm@${{ matrix.npm }}
      - name: Record release toolchain
        run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run release:verify
      - run: npm run test:release
      - run: npm run build
      - run: npm run test:package
